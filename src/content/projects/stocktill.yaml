caseStudy:
  - label: Problem
    text: "Small shops run the counter on spreadsheets: stock drifts, cashiers can see margins they shouldn't, and nobody knows who changed what."
  - label: Solution
    text: A fast register for any USB scanner or the keyboard alone, inventory with low-stock alerts and Excel import, reports, returns and an activity log.
  - label: Technical decisions
    text: Tenant isolation and roles live in PostgreSQL RLS, not just the UI. Stock only changes through database functions that log every movement, and money is stored as exact decimals.
  - label: Result
    text: A live public demo backed by unit, pgTAP, integration and Playwright end-to-end tests that run in GitHub Actions on every push.
