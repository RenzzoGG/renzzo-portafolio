summary: "Dental clinic booking system: Django REST API + React/TypeScript dashboard, overlap-proof bookings enforced by PostgreSQL, JWT roles, 98% backend test coverage, CI-gated deploys on Railway."
disclaimer: Clearline is a fictional clinic, built as a portfolio project.
stats: [98% backend test coverage, Overlap-proof bookings, JWT roles]
caseStudy:
  - label: Patients
    text: "Patients book a visit in five steps (service → dentist → date and time → details → confirm) with live availability."
  - label: Front desk
    text: "The front desk gets a week/day schedule per dentist color-coded by status, confirm/complete/cancel from a side drawer, and insights for 7/30/90 days."
  - label: Admins
    text: Admins manage dentists, services and patients, plus the Django admin.
  - label: Demo
    text: Public demo accounts exist, and demo data resets nightly.
