  about: "I'm a Full-Stack Developer based in Hermosillo, Mexico, studying Information Systems and Digital Networks Engineering. My portfolio projects cover the whole product. Clearline Dental is a booking system with a Django REST API and a React dashboard, where PostgreSQL itself prevents overlapping appointments. Stocktill is a multi-store POS and inventory SaaS with Next.js, Supabase and Stripe, where Row-Level Security isolates each business's data and 700+ automated tests run in CI on every push. I also care about how an interface feels: for Pulse Theory, I built a GSAP motion redesign that stays accessible, with a switch that turns all motion off. I deploy what I build myself, Docker, custom domains and HTTPS included. Open to freelance projects."
  cvSummary: "Full-Stack Developer based in Hermosillo, Mexico, studying Information Systems and Digital Networks Engineering. I built Clearline Dental, a booking system with a Django REST API and a React dashboard where PostgreSQL prevents overlapping appointments, and Stocktill, a multi-store POS and inventory SaaS with Next.js, Supabase and Stripe, isolated by Row-Level Security and backed by 700+ automated tests in CI. I also built an accessible GSAP motion redesign for Pulse Theory. I deploy what I build myself, Docker, custom domains and HTTPS included. Open to freelance projects."
